<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Marquee with Heading</title>
    <style>
        /* Main Container for Marquee */
        .marquee-container {
            width: 100%;
            height: 200px;  /* Define height for marquee */
            position: relative; /* Positioning context for absolute elements */
            overflow: hidden;
            display: flex;
            flex-direction: column; /* Stack heading above images */
            align-items: center; /* Center items horizontally */
        }

        /* Heading Style */
        .marquee-heading {
            font-size: 24px;
            margin: 10px 0; /* Spacing around the heading */
            text-align: center; /* Center text */
            z-index: 1; /* Ensure heading is above the images */
        }

        /* Marquee Effect for Images */
        .marquee {
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            align-items: center; /* Center images vertically */
            animation: marquee 15s linear infinite; /* Apply scrolling animation */
        }

        /* Images inside Marquee */
        .marquee img {
            display: inline-block;
            width: 150px;
            height: auto;
            margin-right: 20px;
        }

        /* Keyframes for scrolling effect */
        @keyframes marquee {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(-100%);
            }
        }

        /* Responsive Design for smaller screens */
        @media (max-width: 768px) {
            .marquee img {
                width: 100px;
            }
        }

        /* Placeholder Style */
        .placeholder {
            display: inline-block;
            width: 150px; /* Match the image width */
            height: auto;
            margin-right: 20px;
            background-color: #ccc; /* Gray background for placeholder */
            text-align: center; /* Center text in placeholder */
            line-height: 150px; /* Center text vertically */
            font-size: 16px; /* Font size for placeholder text */
            color: #fff; /* White text color */
        }
    </style>
</head>
<body>

    <div class="marquee-container">
        <!-- Centered Heading -->
        <h1 class="marquee-heading">Lazy Loading Images Marquee</h1>

        <!-- Images with lazy loading -->
        <div class="marquee">
            <!-- Placeholder Images -->
            <div class="placeholder">Loading...</div>
            <div class="placeholder">Loading...</div>
            <div class="placeholder">Loading...</div>
            <div class="placeholder">Loading...</div>
            <div class="placeholder">Loading...</div>

            <!-- Actual Images with lazy loading -->
            <img src="https://via.placeholder.com/150" loading="lazy" alt="Image 1">
            <img src="https://via.placeholder.com/150" loading="lazy" alt="Image 2">
            <img src="https://via.placeholder.com/150" loading="lazy" alt="Image 3">
            <img src="https://via.placeholder.com/150" loading="lazy" alt="Image 4">
            <img src="https://via.placeholder.com/150" loading="lazy" alt="Image 5">
        </div>
    </div>

</body>
</html>
